name: Airdrop customer visibility checks
on:
  push:
    branches: [codex/airdrop-customer-visibility]
  pull_request:
    paths: ['src/lib/status*', 'src/lib/airdrop-*.ts', 'scripts/test-airdrop*', 'src/app/api/packages/**', 'src/app/dashboard/packages/**']
permissions:
  contents: read
jobs:
  customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
      - run: node node_modules/vitest/vitest.mjs run src/lib/status.test.ts src/lib/referral.test.ts
      - run: node scripts/test-airdrop-documents.cjs
      - run: node scripts/test-airdrop-billing-weight.cjs
